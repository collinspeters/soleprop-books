services:
  - type: web
    name: akaunting-saas
    env: php
    buildCommand: |
      composer install --no-dev --optimize-autoloader
      npm install
      npm run production
      php artisan config:cache
      php artisan route:cache
      php artisan view:cache
    startCommand: |
      php artisan migrate --force
      php artisan serve --host=0.0.0.0 --port=$PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        fromDatabase:
          name: akaunting-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: akaunting-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: akaunting-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: akaunting-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: akaunting-db
          property: password
      - key: CACHE_DRIVER
        value: redis
      - key: SESSION_DRIVER
        value: redis
      - key: QUEUE_CONNECTION
        value: redis
      - key: REDIS_URL
        fromService:
          type: redis
          name: akaunting-redis
          property: connectionString

  - type: redis
    name: akaunting-redis
    ipAllowList: []

  - type: worker
    name: akaunting-queue
    env: php
    buildCommand: composer install --no-dev --optimize-autoloader
    startCommand: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    envVars:
      - key: APP_ENV
        value: production
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        fromDatabase:
          name: akaunting-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: akaunting-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: akaunting-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: akaunting-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: akaunting-db
          property: password
      - key: REDIS_URL
        fromService:
          type: redis
          name: akaunting-redis
          property: connectionString

databases:
  - name: akaunting-db
    databaseName: akaunting
    user: akaunting_user